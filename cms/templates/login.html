{% extends "base.html" %}
{% block title %}Đăng nhập · BlogCo CMS{% endblock %}
{% block body %}
<section class="login-card panel" aria-labelledby="login-title">
  <p class="eyebrow">LOCAL EDITORIAL WORKSPACE</p>
  <h1 id="login-title">Đăng nhập CMS</h1>
  <p class="muted">CMS chỉ lắng nghe trên máy này. Mã truy cập được kiểm tra bằng hash có salt.</p>
  {% if error %}<p class="notice notice--error" role="alert">{{ error }}</p>{% endif %}
  <form action="/login" method="post" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="passcode">Mã truy cập</label>
    <input id="passcode" name="passcode" type="password" inputmode="numeric" autocomplete="current-password" required autofocus>
    <button class="button" type="submit">Vào CMS <span aria-hidden="true">→</span></button>
  </form>
</section>
{% endblock %}
