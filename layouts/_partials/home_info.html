{{- with site.Params.homeInfoParams }}
<article class="first-entry home-info">
  <header class="entry-header"><h1>{{ .Title | markdownify }}</h1></header>
  <div class="entry-content md-content">
    {{ $opts := dict "display" "block" }}
    {{ .Content | $.Page.RenderString $opts }}
  </div>
  <footer class="entry-footer">
    {{ partial "social_icons.html" (dict "align" site.Params.homeInfoParams.AlignSocialIconsTo) }}
  </footer>
</article>
<section class="blogco-search" data-blog-feature="search" data-index="{{ "index.json" | relURL }}">
  <label for="blogco-search-input">Tìm kiếm bài viết</label>
  <input id="blogco-search-input" type="search" autocomplete="off" placeholder="Nhập từ khóa…">
  <div data-search-results aria-live="polite"></div>
</section>
<div id="water-app" class="water-app-container" data-water-app hidden aria-live="off"></div>
{{- end -}}
