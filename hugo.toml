baseURL = 'https://blogco.github.io/blogco/'
timeZone = 'Asia/Ho_Chi_Minh'
locale = 'vi-VN'
defaultContentLanguage = 'vi'
title = 'BlogCo'
theme = 'PaperMod'
enableRobotsTXT = true
enableGitInfo = false

[pagination]
  pagerSize = 12

[languages.vi]
  label = 'Tiếng Việt'
  locale = 'vi-VN'
  weight = 1

[module]
  [module.hugoVersion]
    extended = true
    min = '0.146.0'

[params]
  description = 'BlogCo — chia sẻ kiến thức và góc nhìn.'
  defaultTheme = 'light'
  disableThemeToggle = true
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowSearchButton = true
  githubRepo = 'blogco/blogco'

  [params.footer]
    hideCopyright = false
    text = 'Ericsson Inspired Corporate Identity System'

  # Client-side lock for the personal SPA modules (#/water, #/health, #/coffee).
  # Static site only: this is a convenience gate, not a server-enforced secret.
  # Only the SHA-256 digest is stored here (plaintext is never committed).
  [params.security]
    passcodeHash = '7c531d72f7f14604e25fbb7862b1ed4e2b8f9a64534e32f4d877e645e6364da3'
    disableLock = false

  mainSections = ['posts']

  [params.blog]
    branch = 'main'
    # Repo folder committed images land in; served at the site root by Hugo.
    uploadsDir = 'static/uploads'

  # Optional stock-photo providers for auto thumbnails. Leave empty to use the
  # built-in auto illustration (picsum.photos seeded by slug).
  [params.media]
    unsplashKey = ''
    pexelsKey = ''

  [params.homeInfoParams]
    Title = 'BlogCo'
    Content = 'Góc chia sẻ kiến thức, công nghệ và những ý tưởng đáng khám phá.'

[outputs]
  home = ['HTML', 'RSS']

[markup.highlight]
  noClasses = false

[markup.goldmark.renderer]
  unsafe = false
