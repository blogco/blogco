baseURL = 'https://blogco.github.io/blogco/'
timeZone = 'Asia/Ho_Chi_Minh'
locale = 'vi-VN'
defaultContentLanguage = 'vi'
title = 'BlogCo'
theme = 'PaperMod'
enableRobotsTXT = true
enableGitInfo = false

[pagination]
  pagerSize = 12

[languages.vi]
  label = 'Tiếng Việt'
  locale = 'vi-VN'
  weight = 1

[module]
  [module.hugoVersion]
    extended = true
    min = '0.146.0'

[params]
  description = 'BlogCo — chia sẻ kiến thức và góc nhìn.'
  defaultTheme = 'light'
  disableThemeToggle = true
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowSearchButton = true
  githubRepo = 'blogco/blogco'

  [params.homeInfoParams]
    Title = 'BlogCo'
    Content = 'Góc chia sẻ kiến thức, công nghệ và những ý tưởng đáng khám phá.'

[outputs]
  home = ['HTML', 'RSS']

[markup.highlight]
  noClasses = false

[markup.goldmark.renderer]
  unsafe = false
