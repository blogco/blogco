name: Build Hugo and deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hugo.yml'
      - 'archetypes/**'
      - 'assets/**'
      - 'config/**'
      - 'content/**'
      - 'data/**'
      - 'layouts/**'
      - 'static/**'
      - 'themes/**'
      - '.gitmodules'
      - 'hugo.toml'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'scripts/smart_post_footer/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    concurrency:
      group: pages-build-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    env:
      HUGO_CACHEDIR: /tmp/hugo_cache
    steps:
      - name: Check out source and theme
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Node.js and npm cache
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Hugo Extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.163.1'
          extended: true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Cache Hugo resources and modules
        uses: actions/cache@v5
        with:
          path: |
            resources/_gen
            /tmp/hugo_cache
          key: hugo-${{ runner.os }}-${{ hashFiles('hugo.toml', '.gitmodules') }}
          restore-keys: hugo-${{ runner.os }}-

      - name: Cache Python content-analysis packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: smart-footer-pip-${{ runner.os }}-${{ hashFiles('scripts/smart_post_footer/requirements.txt') }}

      - name: Install Smart Post Footer analyzer dependency
        run: python3 -m pip install --disable-pip-version-check -r scripts/smart_post_footer/requirements.txt

      - name: Restore Smart Post Footer corpus cache
        uses: actions/cache@v5
        with:
          path: data/smart_post_footer/index.json
          key: smart-footer-${{ runner.os }}-${{ hashFiles('content/posts/**/*.md', 'scripts/smart_post_footer/**') }}
          restore-keys: smart-footer-${{ runner.os }}-

      - name: Analyze published articles for Smart Post Footer
        run: python3 scripts/smart_post_footer/build_index.py

      - name: Install site dependencies
        run: npm ci

      - name: Build minified JavaScript and CSS
        run: npm run build:assets

      - name: Build Hugo site
        run: hugo --gc --minify --baseURL "https://blogco.github.io/blogco/"
        env:
          HUGO_ENVIRONMENT: production

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
