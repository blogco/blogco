name: Build Hugo and deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hugo.yml'
      - 'archetypes/**'
      - 'assets/**'
      - 'config/**'
      - 'content/**'
      - 'data/**'
      - 'layouts/**'
      - 'static/**'
      - 'themes/**'
      - '.gitmodules'
      - 'hugo.toml'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_CACHEDIR: /tmp/hugo_cache
    steps:
      - name: Check out source and theme
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Node.js and npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Hugo Extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.163.1'
          extended: true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Cache Hugo resources and modules
        uses: actions/cache@v4
        with:
          path: |
            resources/_gen
            /tmp/hugo_cache
          key: hugo-${{ runner.os }}-${{ hashFiles('hugo.toml', '.gitmodules') }}
          restore-keys: hugo-${{ runner.os }}-

      - name: Install site dependencies
        run: npm ci

      - name: Build minified JavaScript and CSS
        run: npm run build:assets

      - name: Build Hugo site
        run: hugo --gc --minify --baseURL "https://blogco.github.io/blogco/"
        env:
          HUGO_ENVIRONMENT: production

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
