    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67d5ef" stop-opacity=".75"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity=".95"/>
